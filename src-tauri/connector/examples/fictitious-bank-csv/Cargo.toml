[package]
name = "nemein-example-bank-csv"
version = "1.0.0"
description = "Example Nemein connector for the CSV of an invented bank (fictitious data only)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib is the component's core module; rlib lets the tests call the parser natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
nemein-connector-sdk = { path = "../../sdk" }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
