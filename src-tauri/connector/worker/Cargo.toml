[package]
name = "nemein-connector"
version = "1.0.0"
description = "Runs one Nemein connector component inside a Windows enclosure"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nemein-connector"
path = "src/main.rs"

# Test-only worker without an enclosure. Never built for the installer:
# prepare-desktop builds `--bin nemein-connector` without this feature.
[[bin]]
name = "connector-test-worker"
path = "src/bin/test_worker.rs"
required-features = ["test-worker"]

[[bin]]
name = "connector-sandbox-probe"
path = "src/bin/sandbox_probe.rs"
required-features = ["test-worker"]

[[test]]
name = "supervise"
required-features = ["test-worker"]

[[test]]
name = "sandbox"
required-features = ["test-worker"]

[features]
test-worker = []

[dependencies]
# Only the features the encargo allows: no WASI, no async, no cache.
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
# Same version wasmtime 50 already links: reads imports before compiling.
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "component-model"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
nemein-connector-tools = { path = "../tools" }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
wat = "=1.263.0"
