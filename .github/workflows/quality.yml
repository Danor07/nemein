name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
jobs:
  checks:
    name: Static analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked development dependencies
        run: |
          docker pull "$IMAGE"
          mkdir -p node_modules .stryker-tmp reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/workspace:ro" -v "$PWD/node_modules:/workspace/node_modules" -w /workspace "$IMAGE" sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm rebuild better-sqlite3 --ignore-scripts=false'
          mkdir -p .stryker-tmp reports
      - name: 1 - Strict static analysis
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=2g --cpus=2 -e TZ=UTC -v "$PWD:/workspace:ro" -w /workspace "$IMAGE" npm run lint
      - name: Regression tests
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=2g --cpus=2 -e TZ=UTC -v "$PWD:/workspace:ro" -w /workspace "$IMAGE" npm run test:unit
      - name: 2 - Property invariants
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=2g --cpus=2 -e TZ=UTC -v "$PWD:/workspace:ro" -w /workspace "$IMAGE" npm run test:pbt
      - name: 3 - Adversarial fuzzing
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=2g --cpus=2 -e TZ=UTC -v "$PWD:/workspace:ro" -w /workspace "$IMAGE" npm run test:fuzz

  # One job per scope: a failure in one does not hide the others, and no scope spends another's time.
  mutation:
    name: Mutation ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope:
          [
            api-contract,
            api,
            import,
            statement,
            export,
            main,
            workflow,
            runtime,
            connector-runner,
          ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked development dependencies
        run: |
          docker pull "$IMAGE"
          mkdir -p node_modules .stryker-tmp reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/workspace:ro" -v "$PWD/node_modules:/workspace/node_modules" -w /workspace "$IMAGE" sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm rebuild better-sqlite3 --ignore-scripts=false'
          mkdir -p .stryker-tmp reports
      - name: 4 - Mutation score
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=2g --cpus=2 -e TZ=UTC -v "$PWD:/workspace:ro" -v "$PWD/.stryker-tmp:/workspace/.stryker-tmp" -v "$PWD/reports:/workspace/reports" -w /workspace "$IMAGE" npm run mutation:${{ matrix.scope }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-report-${{ matrix.scope }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # Connector contract (P3): the WIT world, its SDK and the example component.
  # Cargo fetches once; tests and the nested recipe builds then run offline.
  connector:
    name: Connector component
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    defaults:
      run:
        working-directory: src-tauri/connector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: cargo fetch --locked
      - name: Format and Clippy, native and wasm32
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fmt --all --check && cargo clippy --locked --workspace --all-targets --features nemein-connector/test-worker -- -D warnings && cargo clippy --locked --target wasm32-unknown-unknown -p nemein-connector-sdk -p nemein-example-bank-csv -p nemein-fixture-hostile -p nemein-fixture-hostile-describe -p nemein-fixture-hostile-manifest -- -D warnings
      - name: Regression, properties, fuzzing and the component without imports
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p nemein-connector-sdk && cargo test --locked -p nemein-example-bank-csv && cargo test --locked -p nemein-connector-tools && cargo test --locked -p nemein-connector --features test-worker
      - name: Same component bytes from another folder and CARGO_HOME
        run: |
          cargo run --locked -q -p nemein-connector-tools -- build nemein-example-bank-csv "$RUNNER_TEMP/first.wasm"
          mkdir "$RUNNER_TEMP/elsewhere"
          tar --exclude=./target -cf - . | tar -C "$RUNNER_TEMP/elsewhere" -xf -
          cd "$RUNNER_TEMP/elsewhere"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          cargo fetch --locked
          cargo run --locked -q -p nemein-connector-tools -- build nemein-example-bank-csv "$RUNNER_TEMP/second.wasm"
          cmp "$RUNNER_TEMP/first.wasm" "$RUNNER_TEMP/second.wasm"
          sha256sum "$RUNNER_TEMP/first.wasm"

  # cargo-mutants exits 2 when a mutant survives; the shared gate then applies
  # the same 90 % threshold and timeout rejection as the Stryker scopes.
  connector-mutation:
    name: Connector mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo fetch --locked
        working-directory: src-tauri/connector
      # copy_target in .cargo/mutants.toml hands this target/ to every build copy.
      - name: Unmutated tests build dependencies once
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --workspace
      - name: 4 - Mutation score
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          status=0
          cargo mutants --workspace --cargo-arg=--locked -j 3 || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
          node ../../scripts/mutation-gate.js --cargo-mutants mutants.out/outcomes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-report-connector
          path: src-tauri/connector/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  # The worker's portable parts, with its test feature: a separate
  # configuration, since Cargo refuses that feature for the other packages.
  connector-worker-mutation:
    name: Connector worker mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo fetch --locked
        working-directory: src-tauri/connector
      - name: Unmutated worker tests build dependencies once
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p nemein-connector --features test-worker
      - name: 4 - Mutation score
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          status=0
          cargo mutants --config .cargo/mutants-worker.toml --cargo-arg=--locked -j 3 || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
          node ../../scripts/mutation-gate.js --cargo-mutants mutants.out/outcomes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-report-connector-worker
          path: src-tauri/connector/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  # The real enclosure (AppContainer, Job, pipes) only exists on Windows.
  connector-windows:
    name: Connector sandbox (Windows)
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo fetch --locked
        working-directory: src-tauri/connector
      - name: Clippy with the Windows enclosure
        working-directory: src-tauri/connector
        run: cargo clippy --locked -p nemein-connector --features test-worker --all-targets -- -D warnings
      - name: Enclosure, hostile components and chain shutdown
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p nemein-connector --features test-worker --test sandbox -- --nocapture && cargo test --locked -p nemein-connector --features test-worker
      - name: Node crash ends the supervisor and the worker
        run: |
          Push-Location src-tauri/connector
          cargo run --locked -q -p nemein-connector-tools -- build nemein-fixture-hostile "$env:RUNNER_TEMP\hostile.wasm"
          Pop-Location
          $env:NEMEIN_CONNECTOR_CHAIN_BIN = (Resolve-Path src-tauri/connector/target/debug/nemein-connector.exe).Path
          $env:NEMEIN_CONNECTOR_CHAIN_COMPONENT = "$env:RUNNER_TEMP\hostile.wasm"
          node --test test/connector-chain.test.js

  # cargo-mutants over the enclosure decisions (worker/src/sandbox.rs and
  # worker/src/main.rs), judged by the real enclosure tests. Each mutant needs
  # a Windows build and enclosed runs, so the run is split round-robin into
  # four shards; the next job judges them as one run.
  connector-windows-mutation:
    name: Connector enclosure mutation ${{ matrix.shard }}/4
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo fetch --locked
        working-directory: src-tauri/connector
      # copy_target in .cargo/mutants-windows.toml hands this target/ to every build copy.
      - name: Unmutated enclosure tests build dependencies once
        working-directory: src-tauri/connector
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p nemein-connector --features test-worker --lib --test sandbox --test binary --test profile
      - name: 4 - Mutation shard
        working-directory: src-tauri/connector
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          status=0
          cargo mutants --config .cargo/mutants-windows.toml --shard ${{ matrix.shard }}/4 --sharding round-robin --cargo-arg=--locked -j 2 || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-report-connector-windows-${{ matrix.shard }}
          path: src-tauri/connector/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  connector-windows-mutation-gate:
    name: Connector enclosure mutation
    needs: connector-windows-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutation-report-connector-windows-*
          path: ${{ runner.temp }}/shards
      - name: 4 - Mutation score over the four shards
        run: node scripts/mutation-gate.js --cargo-mutants "$RUNNER_TEMP"/shards/mutation-report-connector-windows-{0,1,2,3}/outcomes.json

  # Branch protection requires this name, so it must fail whenever a needed job does not succeed.
  quality:
    name: Quality gate
    needs:
      [
        checks,
        mutation,
        connector,
        connector-mutation,
        connector-worker-mutation,
        connector-windows,
        connector-windows-mutation-gate,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check and mutation scope
        env:
          CHECKS: ${{ needs.checks.result }}
          MUTATION: ${{ needs.mutation.result }}
          CONNECTOR: ${{ needs.connector.result }}
          CONNECTOR_MUTATION: ${{ needs.connector-mutation.result }}
          CONNECTOR_WORKER_MUTATION: ${{ needs.connector-worker-mutation.result }}
          CONNECTOR_WINDOWS: ${{ needs.connector-windows.result }}
          CONNECTOR_WINDOWS_MUTATION: ${{ needs.connector-windows-mutation-gate.result }}
        run: test "$CHECKS" = success && test "$MUTATION" = success && test "$CONNECTOR" = success && test "$CONNECTOR_MUTATION" = success && test "$CONNECTOR_WORKER_MUTATION" = success && test "$CONNECTOR_WINDOWS" = success && test "$CONNECTOR_WINDOWS_MUTATION" = success

  native-static:
    name: Native static gate
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Windows regression, PBT and ACL verification
        run: npm test
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build Windows installer for clean-machine smoke
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis
      - name: Example connector component for the installed smoke
        working-directory: src-tauri/connector
        run: cargo run --locked -q -p nemein-connector-tools -- build nemein-example-bank-csv "$env:RUNNER_TEMP\example-connector.wasm"
      - name: Silent install, shortcut, installed MCP, connector and credential verification
        run: |
          $nemeinVersion = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/smoke-installed.ps1 -InstallerPath "./src-tauri/target/release/bundle/nsis/Nemein_$($nemeinVersion)_x64-setup.exe" -ConnectorComponent "$env:RUNNER_TEMP\example-connector.wasm"

  linux-native:
    name: Linux native check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Patched glib string iterator
        run: cargo test --manifest-path src-tauri/patches/glib/Cargo.toml --lib test_variant_iter_array
      - name: Desktop shell compiles on Linux
        run: |
          mkdir -p desktop-resources/runtime src-tauri/binaries
          touch desktop-resources/runtime/.keep
          # tauri-build copies the externalBin sidecar; Linux never runs connectors.
          touch src-tauri/binaries/nemein-connector-x86_64-unknown-linux-gnu
          cargo check --manifest-path src-tauri/Cargo.toml --locked
